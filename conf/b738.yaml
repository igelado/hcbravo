# Zibo B737-800X profile.
#
# The Zibo creates float-only DataRefs from xlua with
# create_dataref(..., "number"). The plugin discovers their numeric types
# when binding this profile and selects the matching accessor automatically.
#
# Every path below was taken from the aircraft itself: create_dataref() calls
# in plugins/xlua/scripts/, or the strings of the compiled
# plugins/zibomod/lin_x64/zibomod.xpl. None are guessed.

name: Boeing 737-800X (Zibo)

# Matched against sim/aircraft/view/acf_ui_name. Both .acf ship the same ICAO
# but different names, so both are listed.
aircrafts:
 - 'Boeing 737-800X'
 - 'Boeing 737-800X (4k)'

# Fallback, matched against sim/aircraft/view/acf_ICAO.
models:
 - B738


autopilot:
 dials:
  # These three are created by xlua WITH write handlers, so the plugin's
  # read-modify-write actually drives the MCP instead of being overwritten on
  # the next frame.
  alt: 'laminar/B738/autopilot/mcp_alt_dial'
  hdg: 'laminar/B738/autopilot/mcp_hdg_dial'
  crs: 'laminar/B738/autopilot/course_pilot'

  # ⚠️ V/S is the one dial that must use the STOCK DataRef.
  #
  # 'laminar/B738/autopilot/vvi' looks like the obvious choice and accepts
  # writes, but it is NOT the MCP V/S window: B738.glaresheild.lua creates it
  # with no write handler and then assigns it from
  # sim/cockpit2/gauges/indicators/vvi_fpm_pilot every frame. It mirrors the
  # VSI needle -- the aircraft's ACTUAL vertical speed -- so it is an output
  # and writes to it vanish silently.
  #
  # Zibo never made a custom MCP V/S DataRef. zibomod.xpl references
  # sim/cockpit2/autopilot/vvi_dial_fpm and draws the window from it (nothing
  # in the .obj animates it, so the compiled plugin owns that display).
  vs: 'sim/cockpit2/autopilot/vvi_dial_fpm'

  ias:
   is_mach: 'laminar/B738/autopilot/airspeed_mach'
   value: 'laminar/B738/autopilot/mcp_speed_dial_kts_mach'

 # The MCP button lamps do not have to be guessed: objects/738_cockpit_ind.obj
 # drives its MCP light block from exactly hdg_sel_status, lnav_status2,
 # vnav_status2, lvl_chg_status, speed_status1, app_status, vorloc_status,
 # n1_status1, autothrottle_status1 and master_capt_status. The bits below are
 # the same ones the cockpit lights.
 #
 # ⚠️ lnav_status2 and vnav_status2 are DIFFERENT DataRefs from lnav_status and
 # vnav_status1. Anchor any grep (`grep -E 'autopilot/lnav_status$'`) or the
 # substring match will point you at the wrong one.
 modes:
  # CMD A or CMD B engaged.
  ap:
   - key: 'laminar/B738/autopilot/cmd_a_status'
   - key: 'laminar/B738/autopilot/cmd_b_status'

  hdg:
   - key: 'laminar/B738/autopilot/hdg_sel_status'

  # LNAV or VOR/LOC both light the Bravo's single NAV lamp. lnav_status2 is
  # the bit the cockpit MCP lamp uses; lnav_status is kept alongside it
  # because that is what was flight-tested and the two are OR'd anyway.
  nav:
   - key: 'laminar/B738/autopilot/lnav_status'
   - key: 'laminar/B738/autopilot/lnav_status2'
   - key: 'laminar/B738/autopilot/vorloc_status'

  apr:
   - key: 'laminar/B738/autopilot/app_status'

  # The 737 has no back course, so the Bravo's REV button and lamp are best
  # repurposed to VNAV -- bind it to laminar/B738/autopilot/vnav_press. Use
  # vorloc_status here instead if you would rather REV followed VOR/LOC.
  rev:
   - key: 'laminar/B738/autopilot/vnav_status2'

  alt:
   - key: 'laminar/B738/autopilot/alt_hld_status'

  vs:
   - key: 'laminar/B738/autopilot/vs_status'

  # LVL CHG is the 737's IAS/speed mode; speed_status1 covers MCP SPD.
  ias:
   - key: 'laminar/B738/autopilot/lvl_chg_status'
   - key: 'laminar/B738/autopilot/speed_status1'


system:
 # The Zibo simulates its own electrical system and does not drive the stock
 # bus_volts array, so read its DC bus voltage directly. Every LED stays dark
 # until this is non-zero.
 volts:
  - key: 'laminar/B738/dc_volt_value'

 gear:
  # 0 = fully up, 1 = locked down; intermediate ratios indicate transit.
  left:
   safe:
    - key: 'sim/flightmodel2/gear/deploy_ratio'
      index: 1
      values: [1]
   unsafe:
    - key: 'sim/flightmodel2/gear/deploy_ratio'
      index: 1
      values: [0, 1]
      invert: true
  nose:
   safe:
    - key: 'sim/flightmodel2/gear/deploy_ratio'
      index: 0
      values: [1]
   unsafe:
    - key: 'sim/flightmodel2/gear/deploy_ratio'
      index: 0
      values: [0, 1]
      invert: true
  right:
   safe:
    - key: 'sim/flightmodel2/gear/deploy_ratio'
      index: 2
      values: [1]
   unsafe:
    - key: 'sim/flightmodel2/gear/deploy_ratio'
      index: 2
      values: [0, 1]
      invert: true


annunciator:
 # The 737 has no single master warning lamp; the fire bell is the red
 # warning annunciator.
 master_warn:
  - key: 'laminar/B738/annunciator/fire_bell_annun'

 master_caution:
  - key: 'laminar/B738/annunciator/master_caution_light'

 eng_fire:
  - key: 'laminar/B738/annunciator/engine1_fire'
  - key: 'laminar/B738/annunciator/engine2_fire'

 # There is no discrete low-oil-pressure annunciator; the ENG six-pack light
 # is the system-level indicator that covers it.
 oil_low:
  - key: 'laminar/B738/annunciator/six_pack_eng'

 fuel_low:
  - key: 'laminar/B738/annunciator/low_fuel_press_l1'
  - key: 'laminar/B738/annunciator/low_fuel_press_l2'
  - key: 'laminar/B738/annunciator/low_fuel_press_r1'
  - key: 'laminar/B738/annunciator/low_fuel_press_r2'

 anti_ice:
  - key: 'laminar/B738/ice/eng1_heat_pos'
  - key: 'laminar/B738/ice/eng2_heat_pos'
  - key: 'laminar/B738/ice/wing_heat_pos'

 # Starter valve open == starter actually engaged, which is more accurate than
 # the starter switch position (that reads non-zero in CONT and FLT too).
 starter:
  - key: 'laminar/B738/air/engine1/starter_valve'
  - key: 'laminar/B738/air/engine2/starter_valve'

 # APU generators on the bus -- the APU is running and supplying power.
 apu:
  - key: 'laminar/B738/electrical/apu_gen1_pos'
  - key: 'laminar/B738/electrical/apu_gen2_pos'

 hydro_low:
  - key: 'laminar/B738/annunciator/hyd_press_a'
  - key: 'laminar/B738/annunciator/hyd_press_b'

 # Centre tank pumps running == burning from the centre (aux) tank.
 aux_fuel:
  - key: 'laminar/B738/fuel/fuel_tank_pos_ctr1'
  - key: 'laminar/B738/fuel/fuel_tank_pos_ctr2'

 parking_brake:
  - key: 'laminar/B738/annunciator/parking_brake'

 # ⚠️ EXPECT THIS LAMP ON THE GROUND. The 737 has no low-voltage annunciator --
 # that is a GA concept the Bravo inherited -- so the closest equivalent is
 # GEN OFF BUS, which is the NORMAL state until the engine-driven generators
 # come on line. It is not a fault. Map it to standby_pwr_off /
 # trans_bus_off1+2 instead, or leave it out like vacuum_low, if you would
 # rather the lamp stayed dark on the ramp.
 volt_low:
  - key: 'laminar/B738/annunciator/gen_off_bus1'
  - key: 'laminar/B738/annunciator/gen_off_bus2'

 door_open:
  - key: 'laminar/B738/annunciator/six_pack_doors'

# vacuum_low is deliberately absent -- the 737 has no vacuum system, and every
# annunciator label is optional, so that LED stays dark by design.
