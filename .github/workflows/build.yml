name: Build and Test

on:
  workflow_call:
    inputs:
      os:
        description: "OS where to build"
        required: true
        type: string
      build-type:
        description: "Build type (Release/Debug)"
        default: "Release"
        type: string
      upload:
        description: "Upload Outputs"
        default: false
        type: boolean
      artifact-retention-days:
        description: "Number of days to keep uploaded build artifacts"
        default: 7
        type: number
      sanitizers:
        description: "Build with AddressSanitizer and UndefinedBehaviorSanitizer (Linux/macOS only)"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev libusb-1.0-0-dev

    - name: Configure CMake
      shell: bash
      env:
        SANITIZER_FLAGS: ${{ inputs.sanitizers && '-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer' || '' }}
      run: |
        cmake -B "${{ steps.strings.outputs.build-output-dir }}"           -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}           ${SANITIZER_FLAGS:+-DCMAKE_C_FLAGS="$SANITIZER_FLAGS"}           ${SANITIZER_FLAGS:+-DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS"}           ${SANITIZER_FLAGS:+-DCMAKE_EXE_LINKER_FLAGS="$SANITIZER_FLAGS"}           ${SANITIZER_FLAGS:+-DCMAKE_SHARED_LINKER_FLAGS="$SANITIZER_FLAGS"}           -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ inputs.build-type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      env:
        ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:abort_on_error=0
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: ctest --build-config ${{ inputs.build-type }} --output-on-failure

    - name: Prepare plugin artifact
      if: ${{ inputs.upload == true }}
      shell: bash
      env:
        BUILD_OUTPUT_DIR: ${{ steps.strings.outputs.build-output-dir }}
        BUILD_CONFIG: ${{ inputs.build-type }}
      run: |
        artifact_dir="$BUILD_OUTPUT_DIR/artifact"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          mkdir -p "$artifact_dir/$BUILD_CONFIG"
          cp "$BUILD_OUTPUT_DIR/$BUILD_CONFIG/hcbravo.xpl" "$artifact_dir/$BUILD_CONFIG/hcbravo.xpl"
        else
          mkdir -p "$artifact_dir"
          cp "$BUILD_OUTPUT_DIR/hcbravo.xpl" "$artifact_dir/hcbravo.xpl"
        fi

    - name: Upload
      if: ${{ inputs.upload == true }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: output-${{ inputs.os }}
        path: ${{ steps.strings.outputs.build-output-dir }}/artifact
        retention-days: ${{ inputs.artifact-retention-days }}
