name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to create (e.g., 0.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require release from main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be created from main (dispatched on: $REF)"
            exit 1
          fi

  build:
    needs: guard
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    uses: ./.github/workflows/build.yml
    with:
      os: ${{ matrix.os }}
      upload: true
      artifact-retention-days: 3

  package:
    runs-on: ubuntu-latest

    needs: [guard, build]

    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Validate Release Version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Gather Linux Package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: output-ubuntu-latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          path: ${{ steps.strings.outputs.build-output-dir }}/ubuntu

      - name: Gather Windows Package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: output-windows-latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          path: ${{ steps.strings.outputs.build-output-dir }}/windows
      
      - name: Gather MacOS Package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: output-macos-latest
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          path: ${{ steps.strings.outputs.build-output-dir }}/macos
 
      - name: Pack Plugins 
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          install -D ubuntu/hcbravo.xpl Resources/plugins/hcbravo/lin_x64/hcbravo.xpl
          install -D macos/hcbravo.xpl Resources/plugins/hcbravo/mac_x64/hcbravo.xpl
          install -D windows/Release/hcbravo.xpl Resources/plugins/hcbravo/win_x64/hcbravo.xpl
          cp -R "${{ github.workspace }}/ext/AeroSoft/joystick configs" "Resources/joystick configs/"
          cp -R "${{ github.workspace }}/conf" Resources/plugins/hcbravo/conf
          mkdir -p Output/preferences
          cp "${{ github.workspace }}"/profiles/*.prf Output/preferences/
          zip -r "hcbravo-v${RELEASE_VERSION}.zip" Resources Output
          sha256sum "hcbravo-v${RELEASE_VERSION}.zip" > SHA256SUMS

      - name: Create Release Tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v${RELEASE_VERSION}" "$GITHUB_SHA"
          git push origin "v${RELEASE_VERSION}"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'HCBravo Release v${{ steps.version.outputs.version }}'
          files: |
            ${{ steps.strings.outputs.build-output-dir }}/hcbravo-v${{ steps.version.outputs.version }}.zip
            ${{ steps.strings.outputs.build-output-dir }}/SHA256SUMS
      
