name: 'Antigravity Code Review'

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'read'
  pull-requests: 'write'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: 'Install Antigravity CLI'
        run: |-
          curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: 'Restore Antigravity authentication'
        env:
          ANTIGRAVITY_CONFIG_TGZ_B64: '${{ secrets.ANTIGRAVITY_CONFIG_TGZ_B64 }}'
        run: |-
          if [[ -z "${ANTIGRAVITY_CONFIG_TGZ_B64}" ]]; then
            echo "::error::ANTIGRAVITY_CONFIG_TGZ_B64 secret is required. agy currently falls back to an interactive OAuth flow without a pre-authenticated Antigravity config bundle."
            exit 1
          fi

          printf '%s' "${ANTIGRAVITY_CONFIG_TGZ_B64}" | base64 -d | tar -xz -C "${HOME}"

      - name: 'Execute PR Review'
        id: 'agy_review'
        run: |-
          git fetch origin "${{ github.base_ref }}"

          agy -p "Review the changes between origin/${{ github.base_ref }} and HEAD. Generate a strict checklist of logical flaws, security bugs, or edge cases." > review_output.md

      - name: 'Post Review Comment to PR'
        uses: 'thollander/actions-comment-pull-request@v2'
        with:
          filePath: 'review_output.md'
